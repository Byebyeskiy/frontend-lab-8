<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ЛР №8 — JS Basics</title><style>body{font:16px system-ui;background:#f5f7fb;color:#1c2939;margin:0}main{max-width:1100px;margin:auto;padding:35px 20px}h1{margin-bottom:5px}header{margin-bottom:28px}section{background:white;border-radius:14px;padding:22px;margin:18px 0;box-shadow:0 4px 18px #182c4010}input,select{padding:11px;border:1px solid #c9d2dd;border-radius:8px;margin:5px}button{background:#2754ca;color:white;border:0;border-radius:8px;padding:11px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.item{background:#f2f6fd;padding:16px;border-radius:10px}small{color:#64748b}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:9px;border-bottom:1px solid #ddd}</style></head><body><main><header><h1>Лабораторна робота №8</h1><p>Основи JavaScript · ES Modules · Чисті функції · TVmaze</p></header><section><h2>Пошук та фільтрація серіалів</h2><input id="query" placeholder="Назва серіалу"><select id="genre"><option value="">Усі жанри</option></select><input id="rating" type="number" min="0" max="10" step="0.1" placeholder="Мін. оцінка"><select id="sort"><option value="name">Назва</option><option value="year">Рік</option><option value="rating">Оцінка</option></select><select id="direction"><option value="asc">За зростанням</option><option value="desc">За спаданням</option></select><p id="count"></p><div class="grid" id="shows"></div></section><section><h2>Статистика жанрів</h2><table><thead><tr><th>Жанр</th><th>Кількість</th><th>Середня оцінка</th></tr></thead><tbody id="stats"></tbody></table></section><section><h2>Замикання</h2><button id="counter">Лічильник: 0</button><p id="once"></p><p id="memo"></p></section><section><h2>Перевірка</h2><p>Запустіть <code>node --test</code> у терміналі VS Code для перевірки функцій.</p></section></main><script type="module" src="./main.js"></script></body></html>
